name: Build Android APK (ARM64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python for Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install pillow

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r26d)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup SDL2 Android Project Layout & Purge Robot Icons
        run: |
          git clone --depth 1 --branch release-2.30.8 https://github.com/libsdl-org/SDL.git sdl2-source
          cp -r sdl2-source/android-project android-build
          cd android-build

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

          mkdir -p app/jni/SDL
          cp -r ../sdl2-source/* app/jni/SDL/

          mkdir -p app/jni/SDL/include/SDL2
          cp -r app/jni/SDL/include/*.h app/jni/SDL/include/SDL2/

          mkdir -p app/jni/src
          cp ../src/main.cpp app/jni/src/
          cp ../src/font.hpp app/jni/src/

          mkdir -p app/src/main/assets/assets
          if [ -d "../assets" ]; then
            cp -r ../assets/* app/src/main/assets/assets/ || true
          fi

          cat << 'MK' > app/jni/src/Android.mk
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := main
          SDL_PATH := ../SDL
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/$(SDL_PATH)/include $(LOCAL_PATH)
          LOCAL_SRC_FILES := main.cpp
          LOCAL_SHARED_LIBRARIES := SDL2
          LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -llog -landroid
          LOCAL_CPPFLAGS := -std=c++20
          include $(BUILD_SHARED_LIBRARY)
          MK

          cat << 'APP_MK' > app/jni/Application.mk
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-21
          APP_STL := c++_shared
          APP_ALLOW_MISSING_DEPS := true
          APP_MK

          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters 'arm64-v8a'/g" app/build.gradle 2>/dev/null || true

          # Поднимаем versionCode до 3
          sed -i 's/versionCode [0-9]*/versionCode 3/g' app/build.gradle 2>/dev/null || true
          sed -i 's/versionName "[^"]*"/versionName "1.0.2"/g' app/build.gradle 2>/dev/null || true

          mkdir -p app/src/main/res/values
          cat << 'STRINGS' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Disnakector</string>
          </resources>
          STRINGS

          # Жестко блокируем экран в горизонтальной ориентации
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' app/src/main/AndroidManifest.xml

          rm -rf app/src/main/res/mipmap-anydpi*
          rm -rf app/src/main/res/drawable-anydpi*

          python3 - << 'PY'
          from PIL import Image, ImageDraw
          import os

          img = Image.new("RGBA", (192, 192), (14, 20, 30, 255))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([6, 6, 186, 186], radius=40, fill=(18, 25, 38, 255), outline=(43, 216, 87, 255), width=7)
          d.rounded_rectangle([42, 42, 150, 150], radius=24, fill=(43, 216, 87, 255))
          d.rounded_rectangle([58, 58, 134, 134], radius=16, fill=(30, 160, 70, 255))
          d.ellipse([64, 76, 88, 108], fill=(255, 205, 30, 255))
          d.ellipse([104, 76, 128, 108], fill=(255, 205, 30, 255))
          d.rectangle([74, 80, 78, 104], fill=(10, 15, 25, 255))
          d.rectangle([114, 80, 118, 104], fill=(10, 15, 25, 255))
          d.ellipse([70, 82, 74, 86], fill=(255, 255, 255, 255))
          d.ellipse([110, 82, 114, 86], fill=(255, 255, 255, 255))

          res_map = [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]
          for folder, sz in res_map:
              p = f"app/src/main/res/{folder}"
              os.makedirs(p, exist_ok=True)
              scaled = img.resize((sz, sz), Image.Resampling.LANCZOS)
              scaled.save(f"{p}/ic_launcher.png")
              scaled.save(f"{p}/ic_launcher_round.png")
          PY

      - name: Build Debug APK with Gradle
        run: |
          cd android-build
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          cp android-build/app/build/outputs/apk/debug/app-debug.apk Disnakector.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disnakector-Android-APK
          path: Disnakector.apk

      - name: Attach APK to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 Disnakector.apk --clobber
